name: Auto-update whatsmeow & dependencies

on:
  schedule:
    # Run every Monday at 02:00 UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  update-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Update dependencies and test build
        run: |
          chmod +x scripts/update-deps.sh
          ./scripts/update-deps.sh

      - name: Check for changes
        id: git_status
        run: |
          if git diff --quiet go.mod go.sum; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.git_status.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(deps): update whatsmeow to latest"
          title: "chore(deps): update whatsmeow to latest"
          body: |
            Automated weekly update for `whatsmeow` and dependencies.
            Verified compilation with `go build`.
          branch: "chore/update-whatsmeow"
          delete-branch: true
